# =====================================================================
# Backend Treinamento LMS — GKE, namespace `apps`.
#
# Modelado a partir de `ge21gt-repo/atendimento-idesp-api` e
# `ge21gt-repo/geodados-acesso` (padrao da casa).
#
# STORAGE: S3 da AWS (STORAGE_BACKEND=s3). A aplicacao NAO grava em disco,
# entao nao ha PVC nem Recreate — escala com RollingUpdate e HPA.
#
# SEGREDOS: criados pela infraestrutura, nao por este manifesto.
#   db-conn-treinamento       chaves: url        (DATABASE_URL completa,
#                                   ex.: postgresql+asyncpg://user:pass@host:5432/db)
#   treinamento-secrets       chaves: secret-key, keycloak-client-secret,
#                                   s3-access-key, s3-secret-key
#
# VARIAVEIS NAO SENSIVEIS ficam como `value:` aqui no Deployment.
# VARIAVEIS SENSIVEIS vem de `secretKeyRef`.
#
# A app le tudo de env var (nao usa .env dentro do container) e escuta a
# porta 8080.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treinamento-idesp-api
  namespace: apps
  labels:
    app.kubernetes.io/name: treinamento-idesp-api
    app.kubernetes.io/part-of: treinamento-idesp
    app.kubernetes.io/managed-by: jenkins
spec:
  # RollingUpdate (sem PVC o pod novo monta enquanto o antigo drena).
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: treinamento-idesp-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: treinamento-idesp-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: treinamento-idesp-api
          image: IMAGE_URI
          ports:
            - name: http
              containerPort: 8080
          # --- Variáveis NÃO sensíveis (env direto) ---
          env:
            - name: STORAGE_BACKEND
              value: s3
            - name: S3_BUCKET
              value: ge21gt-treinamento-idesp
            - name: S3_REGION
              value: us-east-1
            - name: KEYCLOAK_SERVER
              value: https://keycloak-stg.idesp.sp.gov.br
            - name: KEYCLOAK_REALM
              value: idesp-realm
            - name: KEYCLOAK_ISSUER
              value: https://keycloak-stg.idesp.sp.gov.br/realms/idesp-realm
            - name: KEYCLOAK_CLIENT_ID
              value: treinamento-front
            - name: KEYCLOAK_JWKS_URI
              value: https://keycloak-stg.idesp.sp.gov.br/realms/idesp-realm/protocol/openid-connect/certs
            - name: KEYCLOAK_PARTICIPANTE_APROVADO
              value: "true"
            - name: CORS_ORIGINS
              value: '["https://igc.idesp.sp.gov.br"]'
            # Endereco publico: https://igc.idesp.sp.gov.br/treinamento-api.
            # O Ingress remove o prefixo; ROOT_PATH so informa a app (OpenAPI,
            # /docs e tokenUrl). Rotas internas seguem em /api/v1 e /health.
            - name: ROOT_PATH
              value: /treinamento-api
            - name: BASE_URL
              value: https://igc.idesp.sp.gov.br/treinamento-api/api/v1

            # --- Variáveis SENSÍVEIS (secretKeyRef) ---
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-conn-treinamento
                  key: url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: treinamento-secrets
                  key: secret-key
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: treinamento-secrets
                  key: keycloak-client-secret
                  optional: true
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: treinamento-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: treinamento-secrets
                  key: s3-secret-key

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: treinamento-idesp-api
  namespace: apps
  labels:
    app.kubernetes.io/name: treinamento-idesp-api
    app.kubernetes.io/part-of: treinamento-idesp
    app.kubernetes.io/managed-by: jenkins
spec:
  selector:
    app.kubernetes.io/name: treinamento-idesp-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# MINION do master `edge/igc-host` (F5 NGINX Ingress Controller, host
# compartilhado). Sem `tls:` (TLS e do master, `igc-tls-prod`) e sem
# annotations `nginx.ingress.kubernetes.io/*` (o F5 ignora).
#
# https://igc.idesp.sp.gov.br/treinamento-api/api/v1/... chega no pod como
# /api/v1/... : `location /treinamento-api/ { proxy_pass http://upstream/; }`.
# `/treinamento-api` sem barra recebe 301 do nginx para `/treinamento-api/`.
# A interface fica em /treinamento (Ingress proprio do front); o prefixo mais
# longo ganha, entao os dois nao colidem.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: treinamento-idesp-api
  namespace: apps
  labels:
    app.kubernetes.io/name: treinamento-idesp-api
    app.kubernetes.io/part-of: treinamento-idesp
    app.kubernetes.io/managed-by: jenkins
  annotations:
    nginx.org/mergeable-ingress-type: minion
    nginx.org/rewrites: serviceName=treinamento-idesp-api rewrite=/
    nginx.org/client-max-body-size: 600m
    nginx.org/proxy-read-timeout: 300s
spec:
  ingressClassName: nginx
  rules:
    - host: igc.idesp.sp.gov.br
      http:
        paths:
          - path: /treinamento-api/
            pathType: Prefix
            backend:
              service:
                name: treinamento-idesp-api
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: treinamento-idesp-api
  namespace: apps
  labels:
    app.kubernetes.io/name: treinamento-idesp-api
    app.kubernetes.io/part-of: treinamento-idesp
    app.kubernetes.io/managed-by: jenkins
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: treinamento-idesp-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70