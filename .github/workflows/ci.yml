name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes loaded')"

      - name: Install test deps
        run: pip install pytest pytest-asyncio

      - name: Run non-DB tests
        run: python -m pytest tests/test_health.py tests/test_imports.py tests/test_auth.py tests/test_rbac.py tests/test_us05.py tests/test_us06.py -v
