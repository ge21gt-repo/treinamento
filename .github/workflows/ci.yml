name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lms_idesp
  STORAGE_BACKEND: local
  SECRET_KEY: ci-secret-key-for-github-actions

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_idesp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Check imports
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes loaded')"

      - name: Lint (ruff check)
        run: ruff check --output-format=github

      - name: Format check (ruff format)
        run: ruff format --check

      - name: Create lms schema
        run: psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS lms"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_idesp

      - name: Run tests
        run: python -m pytest -v --tb=short
